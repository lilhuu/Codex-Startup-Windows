name: Windows build and test
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test frontend and CDP
        run: node --test tools/*.test.mjs
      - name: Test installation core
        shell: powershell
        run: ./tools/test-installer.ps1
      - name: Build setup and portable package
        shell: powershell
        run: ./tools/build-release.ps1
      - name: Test real embedded installer
        shell: powershell
        run: ./tools/test-installer-integration.ps1 -Installer ./release/CodexStartupWindows-Setup-1.0.0.exe
      - uses: actions/upload-artifact@v4
        with:
          name: Codex-Startup-Windows
          path: release/
